name: Sandbox Uptime Probe → Discord Alert

# 5-min cron probe of dev.puregoldclassictranslation.com/api/health
# On failure: POST to Discord webhook → #sandbox-alerts channel
#
# Architecture (2026-04-09):
#   - This workflow is the EXTERNAL observer. Truly decoupled from Mac mini.
#   - Discord channel acts as a notification dashboard. zsy666's phone Discord
#     app pushes alerts; zsy666 then DMs Beacon on Telegram to trigger diagnosis.
#   - Beacon's Discord-channel ingest path is NOT YET WORKING (OpenClaw issue,
#     needs investigation). For now this is a hybrid: external alert →
#     human-in-loop → Beacon DM (which IS verified working).
#   - Telegram remains as a working spare path; not actively used by this workflow.
#
# Why GitHub Actions instead of UptimeRobot/BetterStack:
#   - Truly external observer (runs on GitHub infra, not Mac mini → no shared fate)
#   - Free tier supports this use case
#   - No third-party UI to navigate; config is this yaml file
#   - 5-min minimum schedule + ~5-15 min jitter (acceptable for sandbox)
#
# What this DOESN'T do:
#   - State tracking. Each run is independent. Site down for 30 min → 6 alerts.
#     If too noisy in practice, add gist-based dedup later.
#   - Recovery notifications. Absence of new alerts == recovery signal.

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes (GitHub Actions free tier minimum)
  workflow_dispatch:        # manual trigger button (for testing)

# Don't pile up runs if a previous probe is somehow still running.
concurrency:
  group: sandbox-uptime-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Probe public /api/health
        id: probe
        run: |
          set -u
          URL="https://dev.puregoldclassictranslation.com/api/health"
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 12 "$URL" || echo "000")
          BODY=$(cat /tmp/body 2>/dev/null | tr -d '\n' | head -c 400 || echo "")

          echo "Probe result: HTTP $STATUS"
          echo "Body (truncated): $BODY"

          # Both HTTP code AND body content must check out.
          # The /api/health endpoint returns {"status":"ok",...} when healthy.
          if [ "$STATUS" != "200" ] || ! echo "$BODY" | grep -q '"status":"ok"'; then
            echo "OUTCOME: FAIL"
            echo "fail=true" >> "$GITHUB_OUTPUT"
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            # Escape body for JSON: drop quotes, just use the truncated form
            ESCAPED_BODY=$(echo "$BODY" | tr -d '"' | head -c 200)
            echo "body=$ESCAPED_BODY" >> "$GITHUB_OUTPUT"
          else
            echo "OUTCOME: OK"
            echo "fail=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord alert (only on failure)
        if: steps.probe.outputs.fail == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret not set in repo settings"
            exit 1
          fi

          STATUS="${{ steps.probe.outputs.status }}"
          BODY="${{ steps.probe.outputs.body }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Single-line message. Discord channel is configured as a notification dashboard
          # that zsy666's phone Discord app pushes; zsy666 then DMs Beacon on Telegram to
          # trigger diagnosis (Beacon DM ingest is verified working; Discord ingest is
          # pending — see docs/deploy/openclaw-agent/README.md). The [UPTIME-ALERT]
          # prefix remains because Beacon's context doctrine still parses it.
          MSG="[UPTIME-ALERT] dev.puregoldclassictranslation.com/api/health is DOWN. HTTP=${STATUS}. Body=${BODY:-empty}. Source: GitHub Actions probe ${RUN_URL}. zsy666: tell Beacon (Telegram DM) to diagnose."

          curl -sS --fail -X POST \
            "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc \
                  --arg content "$MSG" \
                  --arg username 'GitHub Actions Probe' \
                  '{content: $content, username: $username}')"

          echo
          echo "Alert sent to Discord channel via webhook"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.probe.outputs.fail }}" = "true" ]; then
            echo "::warning::Probe FAILED, alert sent to Beacon group"
          else
            echo "::notice::Probe OK, no alert needed"
          fi
