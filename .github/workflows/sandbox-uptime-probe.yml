name: Sandbox Uptime Probe → Telegram Alert

# 5-min cron probe of dev.puregoldclassictranslation.com/api/health
# On failure: POST to Telegram Bot API sendMessage → zsy666's DM with @puregold_sandbox_bot
#
# Architecture (2026-04-09 final):
#   - This workflow is the EXTERNAL observer. Truly decoupled from Mac mini.
#   - On failure: POST sendMessage with Beacon's bot token to zsy666's chat_id.
#     The message arrives in zsy666's Telegram DM with @puregold_sandbox_bot
#     (Beacon's bot itself; bots can't see their own outgoing messages, but
#     zsy666 receives it normally — that's all we need for one-way notification).
#   - In parallel, Beacon runs an internal `openclaw cron` job every 1 minute
#     that probes the same URL and silently self-heals on failure (writing to
#     ~/.openclaw/logs/lifeline-repair.jsonl). That cron job lives entirely on
#     Mac mini and doesn't depend on this workflow.
#   - Both layers are intentionally decoupled and overlap: zsy666 gets notified
#     even if Beacon's cron handles the recovery. By the time zsy666 looks,
#     site is usually already 200.
#
# Why GitHub Actions instead of UptimeRobot/BetterStack:
#   - Truly external observer (runs on GitHub infra, not Mac mini → no shared fate)
#   - Free tier supports this use case
#   - No third-party UI to navigate; config is this yaml file
#   - 5-min minimum schedule + ~5-15 min jitter (acceptable for sandbox)
#
# What this DOESN'T do:
#   - State tracking. Each run is independent. Site down for 30 min → 6 alerts.
#     Beacon's cron typically heals within 2 min, so practical alert volume is low.
#   - Recovery notifications. Absence of new alerts == recovery signal. Beacon's
#     repair log on Mac mini is the canonical record of what was done.

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes (GitHub Actions free tier minimum)
  workflow_dispatch:        # manual trigger button (for testing)

# Don't pile up runs if a previous probe is somehow still running.
concurrency:
  group: sandbox-uptime-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Probe public /api/health
        id: probe
        run: |
          set -u
          URL="https://dev.puregoldclassictranslation.com/api/health"
          STATUS=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 12 "$URL" || echo "000")
          BODY=$(cat /tmp/body 2>/dev/null | tr -d '\n' | head -c 400 || echo "")

          echo "Probe result: HTTP $STATUS"
          echo "Body (truncated): $BODY"

          # Both HTTP code AND body content must check out.
          # The /api/health endpoint returns {"status":"ok",...} when healthy.
          if [ "$STATUS" != "200" ] || ! echo "$BODY" | grep -q '"status":"ok"'; then
            echo "OUTCOME: FAIL"
            echo "fail=true" >> "$GITHUB_OUTPUT"
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            # Escape body for JSON: drop quotes, just use the truncated form
            ESCAPED_BODY=$(echo "$BODY" | tr -d '"' | head -c 200)
            echo "body=$ESCAPED_BODY" >> "$GITHUB_OUTPUT"
          else
            echo "OUTCOME: OK"
            echo "fail=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram alert (only on failure)
        if: steps.probe.outputs.fail == 'true'
        env:
          TG_BEACON_BOT_TOKEN: ${{ secrets.TG_BEACON_BOT_TOKEN }}
          # zsy666's Telegram user_id. Not a secret (just a peer identifier).
          TG_USER_CHAT_ID: '7242492853'
        run: |
          if [ -z "$TG_BEACON_BOT_TOKEN" ]; then
            echo "::error::TG_BEACON_BOT_TOKEN secret not set in repo settings"
            exit 1
          fi

          STATUS="${{ steps.probe.outputs.status }}"
          BODY="${{ steps.probe.outputs.body }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # One-way notification: GitHub Actions → Telegram Bot API → zsy666's DM
          # with @puregold_sandbox_bot. Beacon's cron job will be handling the
          # actual recovery in parallel; this message is purely for human
          # awareness. By the time zsy666 reads it, site is often already healed.
          MSG="[UPTIME-ALERT] dev.puregoldclassictranslation.com/api/health is DOWN. HTTP=${STATUS}. Body=${BODY:-empty}. Beacon's cron is handling self-recovery in parallel. Source: ${RUN_URL}"

          curl -sS --fail -X POST \
            "https://api.telegram.org/bot${TG_BEACON_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc \
                  --arg chat_id "$TG_USER_CHAT_ID" \
                  --arg text "$MSG" \
                  '{chat_id: $chat_id, text: $text}')"

          echo
          echo "Alert sent to zsy666 Telegram DM via Beacon bot"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.probe.outputs.fail }}" = "true" ]; then
            echo "::warning::Probe FAILED, alert sent to Beacon group"
          else
            echo "::notice::Probe OK, no alert needed"
          fi
