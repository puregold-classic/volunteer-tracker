services:
  # 后端API服务
  - type: web
    name: volunteer-backend
    env: node
    region: oregon  # 可以选择: oregon, frankfurt, singapore
    plan: free
    
    # 构建命令
    buildCommand: |
      cd backend && npm ci
      
    # 启动命令
    startCommand: |
      cd backend && node src/server.js
      
    # 健康检查
    healthCheckPath: /api/health
    autoDeploy: true
    
    # 环境变量
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render要求使用10000端口
      - key: MONGODB_URI
        sync: false   # 需要在Render面板手动设置
    
    # 构建和运行环境
    dockerfilePath: ./backend/Dockerfile
    
    # 资源限制（免费层）
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
