services:
  # 后端API服务
  - type: web
    name: volunteer-backend
    env: node
    region: oregon
    plan: free
    
    buildCommand: |
      cd backend && npm ci
      
    startCommand: |
      cd backend && node src/server.js
      
    healthCheckPath: /api/health
    autoDeploy: true
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    
    dockerfilePath: ./backend/Dockerfile
    
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
