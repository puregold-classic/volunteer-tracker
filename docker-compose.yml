version: "3.9"

# Volunteer Tracker - Docker Compose
# 使用方法: docker compose up --build

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: volunteer-postgres
    restart: unless-stopped
    networks:
      - volunteer-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: volunteer_tracker
      POSTGRES_USER: volunteer_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_pg_password}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteer_user -d volunteer_tracker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: volunteer-backend
    restart: unless-stopped
    networks:
      - volunteer-network
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://volunteer_user:${POSTGRES_PASSWORD:-dev_pg_password}@postgres:5432/volunteer_tracker
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_this}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-10}
      # Local-dev bootstrap admin — auto-created on first start when DB has no admin.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@vt.local}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-Admin@123}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {if(r.statusCode===200)process.exit(0);process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  volunteer-network:
    driver: bridge

volumes:
  pg-data:
    driver: local
