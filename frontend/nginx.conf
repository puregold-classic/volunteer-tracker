# nginx config for the frontend container in docker-compose.deploy.yml.
# - Serves the SPA (vite build output) with HTML5 history fallback
# - Proxies /api/* to the backend service on the docker network
# - Caches hashed assets aggressively, no-cache for index.html

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container. The hostname `backend` resolves
    # via docker compose's internal DNS to the backend service on the same
    # network. No CORS needed — same origin from the browser's view.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow long-running review/export endpoints
        proxy_read_timeout 120s;
    }

    # Vite emits hashed filenames under /assets/ — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — every unknown path returns index.html so React Router
    # can take over on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the entry HTML — must always pick up new asset hashes
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
